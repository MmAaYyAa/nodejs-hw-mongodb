type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 672e559aefd1ec206c1b77a8
  name:
    description: "Contact's name"
    type: string
    example: 'Maes'
  phoneNumber:
    description: "Contact's phone number"
    type: integer
    example: 326598741
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: home
  email:
    description: "Contact's email"
    type: string
    example: maes@gmail.com
  isFavourite:
    description: 'Favourite contact'
    type: boolean
    example: true
  userId:
    description: "User's id"
    type: string
    example: 672f73bb18bcb066bb03180e
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
    default: null
