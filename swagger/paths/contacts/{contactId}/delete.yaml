tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: 'Deletes a contact specified by contactId. The user must be authorized to perform this action.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: 'The ID of the contact to be deleted'
    schema:
      type: string
      example: '672f73bb18bcb066bb03180e'
responses:
  '204':
    description: 'Contact deleted successfully'
  '404':
    $ref: '../../../components/responses/404.yaml'
